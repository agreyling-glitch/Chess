[package]
name = "ironwood-server"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[[bin]]
name = "ironwood-server"
path = "src/main.rs"

[[bin]]
name = "ironwood-companion"
path = "src/desktop.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[dependencies]
ironwood-protocol = { path = "../crates/ironwood-protocol" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
shakmaty = "=0.30.1"
shakmaty-syzygy = "=0.28.0"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "backup", "fallible_uint"] }
pgn-reader = "=0.29.0"
sha2 = "0.10"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
