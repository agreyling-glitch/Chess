<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111418">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ $.Title }}" href="{{ .Permalink }}">{{ end }}
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/" aria-label="Ironwood Chess home"><img class="brand-logo" src="/brand/ironwood-logo-192.webp" width="80" height="80" alt="" decoding="async"><span class="brand-name"><span>IRONWOOD</span> CHESS</span></a>
    <nav aria-label="Primary navigation">
      <a href="/features/">Features</a>
      <a href="/blog/">Journal</a>
      <a href="/changelog/">Changelog</a>
      <a class="play-link" href="/play/">Play now</a>
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer>
    <span>Ironwood Chess</span>
    <a href="/features/">Features</a>
    <a href="/blog/">Journal</a>
    <a href="/changelog/">Changelog</a>
    <a href="/open-source-notices.html">Open-source notices</a>
  </footer>
  <script type="module" src="/pwa.js"></script>
</body>
</html>
