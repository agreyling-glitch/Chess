<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111418">
  <meta name="description" content="Play chess against Stockfish 19 with full NNUE evaluation in your browser.">
  <meta name="robots" content="index,follow">
  <title>Play — Ironwood Chess</title>
  <link rel="canonical" href="/play/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#d3ad62">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="msapplication-config" content="/browserconfig.xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <canvas id="chess_canvas"></canvas>
  <div id="loading">Forging the board…</div>
  <script>
    (() => {
      let context;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      window.ironwoodPlayChessSound = kind => {
        if (!AudioContext) return;
        context ||= new AudioContext();
        const play = () => {
          const now = context.currentTime;
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(kind === 'check' ? 480 : kind === 'capture' ? 145 : 210, now);
          oscillator.frequency.exponentialRampToValueAtTime(kind === 'check' ? 320 : 82, now + 0.06);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(kind === 'capture' ? 0.24 : 0.18, now + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (kind === 'check' ? 0.15 : 0.09));
          oscillator.connect(gain).connect(context.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.16);
        };
        if (context.state === 'running') {
          play();
        } else {
          context.resume().then(play).catch(() => {});
        }
      };
    })();
  </script>
  <script type="module">
    import init from '/pkg/battle_chess.js';
    init().then(() => document.getElementById('loading')?.remove());
  </script>
  <script type="module" src="/pwa.js"></script>
</body>
</html>
