<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111418">
  <meta name="description" content="Play chess against Stockfish 19 with full NNUE evaluation in your browser.">
  <meta name="robots" content="index,follow">
  <title>Play — Ironwood Chess</title>
  <link rel="canonical" href="/play/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="msapplication-config" content="/browserconfig.xml">
  <link id="ironwood-styles" rel="stylesheet" href="/styles.css">
  <script>
    if (['localhost', '127.0.0.1'].includes(location.hostname)) {
      document.getElementById('ironwood-styles').href = `/styles.css?v=${Date.now()}`;
    }
  </script>
</head>
<body>
  <canvas id="chess_canvas"></canvas>
  <div id="loading">Forging the board…</div>
  <script>
    // Pointer events omit intermediate button presses/releases in a mouse chord.
    // Supply those missing events to egui, which listens to pointerdown/up.
    (() => {
      const canvas = document.getElementById('chess_canvas');
      let canvasDrag = false;
      const forward = (event, type) => canvas.dispatchEvent(new PointerEvent(type, {
        bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse', isPrimary: true,
        clientX: event.clientX, clientY: event.clientY, button: event.button, buttons: event.buttons,
        ctrlKey: event.ctrlKey, shiftKey: event.shiftKey, altKey: event.altKey, metaKey: event.metaKey,
      }));
      canvas.addEventListener('mousedown', event => {
        canvasDrag = true;
        const mask = [1, 4, 2, 8, 16][event.button] || 0;
        if (event.buttons & ~mask) forward(event, 'pointerdown');
      });
      document.addEventListener('mouseup', event => {
        if (canvasDrag && event.buttons) forward(event, 'pointerup');
        if (!event.buttons) canvasDrag = false;
      }, true);
      window.addEventListener('blur', () => { canvasDrag = false; });
    })();
  </script>
  <script>
    (() => {
      let context;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      window.ironwoodPlayChessSound = kind => {
        if (!AudioContext) return;
        context ||= new AudioContext();
        const play = () => {
          const now = context.currentTime;
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(kind === 'check' ? 480 : kind === 'capture' ? 145 : 210, now);
          oscillator.frequency.exponentialRampToValueAtTime(kind === 'check' ? 320 : 82, now + 0.06);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(kind === 'capture' ? 0.24 : 0.18, now + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (kind === 'check' ? 0.15 : 0.09));
          oscillator.connect(gain).connect(context.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.16);
        };
        if (context.state === 'running') {
          play();
        } else {
          context.resume().then(play).catch(() => {});
        }
      };
    })();
  </script>
  <script type="module">
    const loading = document.getElementById('loading');
    window.ironwoodStoreCurrentGame = () => {};
    window.ironwoodStoreImportedGame = () => {};
    window.ironwoodStartNewStoredGame = () => {};
    window.ironwoodIsImportedDuplicate = () => false;
    window.ironwoodImportedIndexReady = () => false;
    window.ironwoodEnsureImportedIndex = () => {};
    window.ironwoodRefreshStorageStatus = () => {};
    window.ironwoodStorageStatus = () => 'Browser storage estimate unavailable';
    window.ironwoodBeginBatchImport = () => {};
    window.ironwoodBatchImportStatus = () => '{"pending":0,"saved":0,"failed":0,"firstError":null}';
    window.ironwoodEndBatchImport = () => {};
    window.ironwoodOpenGameLibrary = () => alert('Saved games are unavailable. Please reload Ironwood.');
    window.ironwoodBackupStorage = () => alert('Storage backup is unavailable. Please reload Ironwood.');
    window.ironwoodRestoreStorage = () => alert('Storage restore is unavailable. Please reload Ironwood.');
    window.ironwoodOpenStorageInfo = () => alert('Storage information is unavailable. Please reload Ironwood.');
    window.ironwoodClearSavedGames = () => alert('Storage management is unavailable. Please reload Ironwood.');
    window.ironwoodResetLocalData = () => alert('Storage management is unavailable. Please reload Ironwood.');
    window.ironwoodVersionDiagnostics = () => '{"status":"Version diagnostics are loading"}';
    window.ironwoodRefreshVersionDiagnostics = () => {};
    window.ironwoodFicsConnect = () => {};
    window.ironwoodFicsDisconnect = () => {};
    window.ironwoodFicsSend = () => {};
    window.ironwoodFicsSendCommand = () => {};
    window.ironwoodFicsPoll = () => '';
    try {
      const localDevelopment = ['localhost', '127.0.0.1'].includes(location.hostname);
      const storageUrl = localDevelopment ? `/game-storage.js?v=${Date.now()}` : '/game-storage.js';
      const storage = await import(storageUrl).catch(error => {
        console.warn('Ironwood game library is unavailable:', error);
        return null;
      });
      if (storage) await storage.initializeGameStorage();
      await import(localDevelopment ? `/fics/bridge.js?v=${Date.now()}` : '/fics/bridge.js');
      await import('/position-editor/editor.js');
      await import('/scoresheet-import.js');
      await import(localDevelopment ? `/board-clipboard.js?v=${Date.now()}` : '/board-clipboard.js');
      const packageToken = localDevelopment ? Date.now() : null;
      const packageUrl = packageToken ? `/pkg/battle_chess.js?v=${packageToken}` : '/pkg/battle_chess.js';
      const { default: init, export_saved_game, validate_scoresheet_pgn, preview_scoresheet } = await import(packageUrl);
      await (packageToken
        ? init({ module_or_path: `/pkg/battle_chess_bg.wasm?v=${packageToken}` })
        : init());
      window.ironwoodExportSavedGame = export_saved_game;
      window.ironwoodValidateScoresheet = validate_scoresheet_pgn;
      window.ironwoodPreviewScoresheet = preview_scoresheet;
      loading?.remove();
    } catch (error) {
      console.error('Ironwood could not start:', error);
      if (loading) loading.textContent = 'Ironwood could not start. Please reload the page.';
    }
  </script>
  <script type="module">
    const pwaUrl = ['localhost', '127.0.0.1'].includes(location.hostname)
      ? `/pwa.js?v=${Date.now()}`
      : '/pwa.js';
    import(pwaUrl);
  </script>
</body>
</html>
