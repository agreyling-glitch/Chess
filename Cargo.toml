[package]
name = "battle-chess"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[workspace]
members = ["crates/ironwood-protocol", "server"]
default-members = ["."]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chess = "3.2"
shakmaty = "0.30.1"
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "wgpu", "links"] }
egui = "=0.36.1"
egui_extras = { version = "=0.36.1", features = ["svg", "webp"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
log = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "Location", "MediaQueryList", "MessageEvent", "Navigator", "Node", "Storage", "Url", "Window", "Worker", "WorkerOptions", "WorkerType"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[profile.release]
lto = "thin"
opt-level = 2
